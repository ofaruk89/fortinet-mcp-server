name: Release

# Publishes a container image when a version tag is pushed. Tests run first —
# a tag that cannot pass CI should not become an image anyone can pull.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build, e.g. v1.1.0"
        required: true
        type: string

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      # Read into env because the secrets context is not usable in `if:`
      # conditions. Empty means Docker Hub is skipped and only GHCR is pushed.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # arm64 is emulated; the dependencies are prebuilt wheels, so this costs
      # a few minutes rather than a full native compile.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            name=docker.io/${{ env.DOCKERHUB_USERNAME }}/fortinet-mcp-server,enable=${{ env.DOCKERHUB_USERNAME != '' }}
          # v1.2.3 produces 1.2.3, 1.2, 1 and — since latest=auto is the default
          # and this is not a prerelease — latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=FortiOS MCP Server
            org.opencontainers.image.description=MCP server for Fortinet FortiOS — multi-device, containerized, authenticated HTTP transport

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Off so the package listing shows the two real platforms instead of
          # extra unknown/unknown attestation manifests.
          provenance: false

      - name: Summarise
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            if [ -z "$DOCKERHUB_USERNAME" ]; then
              echo
              echo "_Docker Hub skipped: set the \`DOCKERHUB_USERNAME\` and \`DOCKERHUB_TOKEN\` secrets to publish there too._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
