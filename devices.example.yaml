# FortiOS MCP Server — device inventory
#
# Copy to devices.yaml and point FORTIOS_DEVICES_FILE at it:
#   FORTIOS_DEVICES_FILE=/app/devices.yaml     (Docker)
#   FORTIOS_DEVICES_FILE=./devices.yaml        (local)
#
# Every tool takes a `fortigate` parameter naming one of these devices.
# Omitting it targets the device marked `default: true`.
#
# Tokens: each FortiGate issues its own. Keep them in .env and reference them
# here as ${VAR}, so this file holds no secrets. devices.yaml is git-ignored
# and excluded from the Docker image either way.
#
# Per device:
#   name        required  how tools address it (`fortigate: fw-hq-01`)
#   host        required  base URL; add :port only if the admin GUI uses one
#   api_token   required  this FortiGate's REST API token
#   vdom        root      VDOM every call targets unless a tool overrides it
#   verify_ssl  false     verify the FortiGate TLS certificate
#   timeout     30        HTTP timeout in seconds
#   site        -         grouping value; fleet tools can select a whole site
#   tags        -         labels; fleet tools can select by them (must match all)
#   description -         free text, shown by fortios_devices_list
#   default     false     targeted when a call omits `fortigate`

devices:
  # ── Site: hq ──────────────────────────────────────────────────────
  - name: fw-hq-01
    host: https://fw-hq-01.example.com
    api_token: ${FW_HQ_01_TOKEN}
    site: hq
    tags: [edge, ha-primary]
    description: HQ internet edge, HA primary
    verify_ssl: true
    # Exactly one device should carry this.
    default: true

  - name: fw-hq-02
    host: https://fw-hq-02.example.com
    api_token: ${FW_HQ_02_TOKEN}
    site: hq
    tags: [edge, ha-secondary]
    verify_ssl: true

  # Non-default VDOM: every call for this device targets it unless a tool
  # is given its own vdom argument.
  - name: fw-hq-dmz
    host: https://fw-hq-dmz.example.com
    api_token: ${FW_HQ_DMZ_TOKEN}
    vdom: dmz
    site: hq
    tags: [datacenter]
    verify_ssl: true

  # ── Site: branch ──────────────────────────────────────────────────
  - name: fw-branch-01
    host: https://fw-branch-01.example.com
    api_token: ${FW_BRANCH_01_TOKEN}
    site: branch
    tags: [edge]
    # Self-signed certificate: either leave verification off, or import the
    # FortiGate CA into the container trust store and set this to true.
    verify_ssl: false
    # Slow link to this site.
    timeout: 45
