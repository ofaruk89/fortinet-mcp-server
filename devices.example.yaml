# FortiOS MCP Server — device inventory
#
# Copy to devices.yaml and point FORTIOS_DEVICES_FILE at it:
#   FORTIOS_DEVICES_FILE=/app/devices.yaml     (Docker)
#   FORTIOS_DEVICES_FILE=./devices.yaml        (local)
#
# Every FortiGate issues its own API token, so each device needs its own.
# devices.yaml is git-ignored and excluded from the Docker image — it holds
# secrets. To keep tokens out of the file entirely, reference an environment
# variable instead: api_token: ${AEF01_TOKEN}

devices:
  - name: aef01
    host: https://aef01.example.local:4443
    api_token: ${AEF01_TOKEN}
    site: aef
    tags: [edge, primary]
    description: AEF site edge firewall, HA primary
    vdom: root
    verify_ssl: true
    # Targeted when a tool call omits `device`. Mark exactly one device.
    default: true

  - name: aef02
    host: https://aef02.example.local:4443
    api_token: ${AEF02_TOKEN}
    site: aef
    tags: [edge, secondary]
    verify_ssl: true

  - name: bef01
    host: https://bef01.example.local:4443
    api_token: ${BEF01_TOKEN}
    site: bef
    tags: [edge]
    # Self-signed certificate: leave verification off, or import the CA into
    # the container trust store and set this to true.
    verify_ssl: false
    timeout: 45
